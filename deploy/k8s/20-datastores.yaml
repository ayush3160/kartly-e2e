apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: kartly, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: "kartly" }
            - { name: POSTGRES_PASSWORD, value: "kartly" }
            - { name: POSTGRES_DB, value: "kartly" }
          volumeMounts:
            - { name: seed, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: seed
          configMap: { name: seed-postgres }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: kartly }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, namespace: kartly, labels: { app: mysql } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: "root" }
            - { name: MYSQL_DATABASE, value: "accounts" }
            - { name: MYSQL_USER, value: "kartly" }
            - { name: MYSQL_PASSWORD, value: "kartly" }
          volumeMounts:
            - { name: seed, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: seed
          configMap: { name: seed-mysql }
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: kartly }
spec:
  selector: { app: mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
---

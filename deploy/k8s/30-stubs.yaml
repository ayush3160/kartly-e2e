apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, namespace: kartly, labels: { app: catalog } }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: catalog
          image: kartly/stubs:main
          imagePullPolicy: IfNotPresent
          args: ["-svc", "catalog", "-addr", ":9101"]
          ports: [{ containerPort: 9101 }]
          env: []
---
apiVersion: v1
kind: Service
metadata: { name: catalog, namespace: kartly }
spec:
  selector: { app: catalog }
  ports: [{ port: 9101, targetPort: 9101 }]
---

# Replays the tests recorded on main against this pull request's code.
#
# Recording is never done here: main is recorded once, locally, with
# `keploy k8s` (see README). Each PR builds its own orders-api image and runs
# `keploy cloud replay --image` against it. When the replay fails, the job's
# summary names the `keploy cloud triage` command to give your coding agent.
name: keploy cloud replay

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloud-replay-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    # vars.KEPLOY_RUNNER picks a self-hosted runner (e.g. one next to a
    # staging setup); GitHub's own runner otherwise.
    runs-on: ${{ vars.KEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      KEPLOY_API_KEY: ${{ secrets.KEPLOY_API_KEY }}
      APP: kartly.orders-api
      CLUSTER: ${{ vars.KEPLOY_CLUSTER }}
      IMAGE: kartly/orders-api:pr-${{ github.event.pull_request.number || github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cloud replay compares the checkout with the base branch

      - name: Build orders-api for this PR
        run: docker build --target orders-api -t "$IMAGE" .

      - name: Install the Keploy CLI
        # vars.KEPLOY_BIN uses a CLI already on the runner (e.g. a staging
        # build); the released CLI is installed otherwise.
        env:
          KEPLOY_BIN: ${{ vars.KEPLOY_BIN }}
        run: |
          if [ -n "$KEPLOY_BIN" ]; then
            echo "KEPLOY=$KEPLOY_BIN" >> "$GITHUB_ENV"
            "$KEPLOY_BIN" --version
          else
            curl --silent -O -L https://keploy.io/ent/install.sh
            source install.sh
            echo "KEPLOY=keploy" >> "$GITHUB_ENV"
            keploy --version
          fi

      - name: keploy cloud replay
        shell: bash # -eo pipefail: the replay's exit code survives tee
        # --disableReportUpload=false: cloud replay writes a keploy.yml that
        # turns report upload off, and without the uploaded run there is no
        # run id for `keploy cloud triage`.
        run: $KEPLOY cloud replay --app "$APP" --cluster "$CLUSTER" --image "$IMAGE" --disableReportUpload=false 2>&1 | tee replay.log

      - name: Upload the replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-log
          path: replay.log

      - name: Give the workspace back to the runner user
        # The replay runs under sudo and leaves root-owned files; a
        # self-hosted runner's next checkout could not clean them.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
